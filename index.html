<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Box</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <main class="container py-5">
        <h1 class="mb-4">Wake 'N' Bacon Recipe Box</h1>
            <section class="mb-5">
                <h2>Find a Recipe</h2>
                <input type="number" id="recipe-id">
                <button class="btn text-warning btn-dark" id="get-btn">Show Me Potato Salad Recipes!</button>
                <p id="status"></p>
                <div id="recipe"></div>
            </section>

            <section>
                <h2>Add a Dish</h2>
                <input type="text" id="dish-name">
                <button class="btn btn-dark text-danger" id="post-btn">Add That Recipe!</button>
                <p id="post-status"></p>
                <div id="saved"></div>
            </section>
    </main>
<script src="script.js"></script>
</body>
</html>
